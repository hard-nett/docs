<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#cfffcf" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#cfffcf" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#cfffcf" flood-opacity="0.25"/>
    </filter>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0a1a12"/>
      <stop offset="100%" stop-color="#050805"/>
    </radialGradient>
    <filter id="textglow">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#98e8c1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="1198" height="628" rx="4" fill="none" stroke="#98e8c1" stroke-opacity="0.08"/>

  <!-- Glyph — centered, offset upward -->
  <g transform="translate(510, 120) scale(0.9)" filter="url(#glow)">
    <circle cx="100" cy="100" r="9.5" fill="#cfffcf"/>
    <circle cx="52" cy="100" r="8.7" fill="#cfffcf"/>
    <circle cx="148" cy="100" r="8.7" fill="#cfffcf"/>
    <circle cx="100" cy="52" r="8.7" fill="#cfffcf"/>
    <circle cx="100" cy="148" r="8.7" fill="#cfffcf"/>
    <circle cx="75" cy="100" r="8" fill="#cfffcf"/>
    <circle cx="125" cy="100" r="8" fill="#cfffcf"/>
    <circle cx="100" cy="75" r="8" fill="#cfffcf"/>
    <circle cx="100" cy="125" r="8" fill="#cfffcf"/>
    <circle cx="75" cy="75" r="8" fill="#cfffcf"/>
    <circle cx="75" cy="125" r="8" fill="#cfffcf"/>
    <circle cx="125" cy="75" r="8" fill="#cfffcf"/>
    <circle cx="125" cy="125" r="8" fill="#cfffcf"/>
  </g>

  <!-- Title -->
  <text x="600" y="430" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="48" fill="#f0fff0" filter="url(#textglow)">Terp Network</text>

  <!-- Subtitle -->
  <text x="600" y="480" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="24" fill="#98e8c1" opacity="0.7">Documentation</text>

  <!-- Accent line -->
  <line x1="480" y1="510" x2="720" y2="510" stroke="#bd93f9" stroke-opacity="0.2" stroke-width="1"/>
</svg>
